<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raspberry Pi Controller</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Raspberry Pi System Monitor</h1>
        </header>

        <main>
            <section class="system-info">
                <div class="info-grid">
                    <div class="info-card">
                        <h3>CPU Usage</h3>
                        <div class="info-value" id="cpu-usage">--</div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="cpu-progress"></div>
                        </div>
                    </div>

                    <div class="info-card">
                        <h3>Memory Usage</h3>
                        <div class="info-value" id="memory-usage">--</div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="memory-progress"></div>
                        </div>
                    </div>

                    <div class="info-card">
                        <h3>Disk Usage</h3>
                        <div class="info-value" id="disk-usage">--</div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="disk-progress"></div>
                        </div>
                    </div>

                    <div class="info-card">
                        <h3>CPU Temperature</h3>
                        <div class="info-value" id="cpu-temp">--</div>
                    </div>
                </div>

                <div class="info-footer">
                    <p>Last Update: <span id="last-update">--</span></p>
                    <p>Updates Available: <span id="updates-available">--</span></p>
                </div>
            </section>

            <section class="actions">
                <button id="btn-update" class="btn btn-primary">Update System</button>
                <button id="btn-restart" class="btn btn-warning">Restart Device</button>
                <button id="btn-shutdown" class="btn btn-danger">Shutdown Device</button>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 Pi Control System</p>
        </footer>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
